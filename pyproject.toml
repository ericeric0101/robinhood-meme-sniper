[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-meme-sniper"
version = "0.1.0"
description = "Robinhood-chain meme coin authenticity, timeline, and alerting system"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "orjson>=3.10",
  "pandas>=2.2",
  "typer>=0.12",
  "rich>=13.7"
]

[project.scripts]
rh-meme-sniper = "rh_meme_sniper.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
